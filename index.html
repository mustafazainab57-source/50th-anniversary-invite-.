        h2 { color: #075e54; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .stats { display: flex; justify-content: space-around; background: #e2f0d9; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #075e54; color: white; }
        .btn { background-color: #25d366; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn:hover { background-color: #128c7e; }
        .btn-disabled { background-color: #ccc; color: #666; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-weight: bold; display: inline-block; cursor: not-allowed; }
        tr.sent { background-color: #e2f0d9 !important; }
        tr.sent td { color: #555; }
    </style>
</head>

    function getFormattedName(guest) {
        let name = guest.name;
        // Skip title for Rashida (No. 46) or testing rows
        if (guest.no === 46 || guest.no === 52 || guest.no === 53) {
            return name;
        }
        if (name.startsWith("Shk.") || name.startsWith("Shk ")) {
            return name;
        }
        const femaleNames = ["Husainaben", "Ajabben", "Shirin", "Sakinaben", "Fatimaben", "Mariyamben", "Zainab"];
        if (femaleNames.some(f => name.includes(f)) || name.endsWith("ben")) {
            return "Mrs. " + name;
        } else {
            return "Mr. " + name;
        }
    }

    const tbody = document.querySelector("#guestTable tbody");

    guests.forEach(guest => {
        let tr = document.createElement("tr");
        let formattedName = getFormattedName(guest);

        let actionHtml = "";
        if (guest.mobile === "") {
            actionHtml = `<span class="btn-disabled">No Number</span>`;
        } else {
            let cleanNumber = guest.mobile.split('/')[0].replace(/[\s\+\-\(\)]/g, '');
            let websiteLink = `https://mustafazainab57-source.github.io/invite/card.html?name=${encodeURIComponent(formattedName)}&n=${encodeURIComponent(guest.invitees)}`;
            let message = `Salam ${formattedName},\n\nYou are cordially invited to our parents 50th Anniversary celebration! 🎉\n\nPlease view your invite details and RSVP here:\n${websiteLink}\n\nWe look forward to celebrating with you!`;
            let whatsappUrl = `https://wa.me/${cleanNumber}?text=${encodeURIComponent(message)}`;
            
            actionHtml = `<a href="${whatsappUrl}" target="_blank" class="btn" onclick="markSent(this)">Send WhatsApp</a>`;
        }

        tr.innerHTML = `
            <td>${guest.no}</td>
            <td><strong>${formattedName}</strong></td>
            <td>${guest.mobile || '(Blank)'}</td>
            <td>${guest.invitees}</td>
            <td>${actionHtml}</td>
        `;
        tbody.appendChild(tr);
    });

    function markSent(element) {
        setTimeout(() => {
            let row = element.closest("tr");
            row.classList.add("sent");
            element.innerText = "Sent ✓";
            element.style.backgroundColor = "#555";
        }, 400);
    }
