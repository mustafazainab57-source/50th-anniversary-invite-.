<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50th Anniversary Invitation</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background: #fdfbf7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .card-container {
            background: #fff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            border: 2px solid #d4af37;
        }
        h1 {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .greeting {
            font-size: 22px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }
        .invite-details {
            background: #f9f6ed;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #d4af37;
            text-align: left;
        }
        .rsvp-btn {
            background-color: #25d366;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .rsvp-btn:hover {
            background-color: #128c7e;
        }
    </style>
</head>
<body>

<div class="card-container">
    <h1>50th Anniversary Celebration</h1>
    
    <!-- This dynamically changes to match whoever opens the link -->
    <div class="greeting" id="guestGreeting">Ahlan Guest</div>

    <p>We warmly invite you to join us in celebrating this joyous milestone of 50 years together.</p>

    <div class="invite-details">
        <p style="margin: 0;"><strong>📅 Date:</strong> [Insert Date]</p>
        <p style="margin: 10px 0 0 0;"><strong>📍 Venue:</strong> [Insert Venue]</p>
    </div>

    <p>Your presence would make our celebration truly special!</p>

    <a href="#" class="rsvp-btn" id="rsvpLink">RSVP via WhatsApp</a>
</div>

<script>
    // This grabs the guest name from the URL automatically for any guest
    const urlParams = new URLSearchParams(window.location.search);
    const guestName = urlParams.get('name');

    if (guestName) {
        const decodedName = decodeURIComponent(guestName);
        document.getElementById('guestGreeting').innerText = `Ahlan ${decodedName}`;
    } else {
        document.getElementById('guestGreeting').innerText = `Ahlan Family & Friends`;
    }

    document.getElementById('rsvpLink').addEventListener('click', function(e) {
        e.preventDefault();
        const rsvpMessage = encodeURIComponent(`Hello, I would like to RSVP for the 50th Anniversary celebration! ${guestName ? '(Guest: ' + guestName + ')' : ''}`);
        window.location.href = `https://wa.me/+96599056686?text=${rsvpMessage}`;
    });
</script>

</body>
</html>
