<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guest Link Generator — 50th Anniversary</title>
<style>
  :root{
    --cream: #f5ecd9;
    --cream-light: #faf5e8;
    --gold: #b8923f;
    --gold-dark: #8a6d2f;
    --green: #1d3a2c;
    --text: #2b2b26;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: var(--text);
    padding: 24px 14px 60px;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  h1{
    text-align:center;
    color: var(--green);
    font-size: 21px;
    margin-bottom: 4px;
  }
  .sub{
    text-align:center;
    color: var(--gold-dark);
    font-style: italic;
    font-size: 13.5px;
    margin-bottom: 22px;
  }
  .form-card{
    background: var(--cream-light);
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 18px;
    margin-bottom: 22px;
  }
  label{
    display:block;
    font-size: 13px;
    color: var(--green);
    margin-bottom: 4px;
    margin-top: 12px;
  }
  label:first-child{ margin-top:0; }
  input{
    width:100%;
    padding: 10px 12px;
    border: 1px solid var(--gold);
    border-radius: 6px;
    font-family: inherit;
    font-size: 14.5px;
  }
  .add-btn{
    width:100%;
    margin-top: 16px;
    padding: 12px;
    border:none;
    border-radius: 6px;
    background: var(--gold-dark);
    color:white;
    font-size: 15px;
    font-family: inherit;
    cursor:pointer;
  }
  .list-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 10px;
  }
  .list-header h2{
    font-size: 16px;
    color: var(--green);
    margin:0;
  }
  .copy-all-btn{
    font-size: 12.5px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--gold);
    background: white;
    cursor:pointer;
    font-family: inherit;
  }
  .guest-item{
    background: white;
    border: 1px solid var(--gold);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .guest-item .name{
    font-weight: bold;
    color: var(--green);
    font-size: 14.5px;
  }
  .guest-item .meta{
    font-size: 12.5px;
    color: var(--gold-dark);
    margin-bottom: 6px;
  }
  .link-row{
    display:flex;
    gap: 6px;
  }
  .link-row input{
    font-size: 12px;
    padding: 7px 8px;
    background: #faf8f2;
  }
  .link-row button{
    padding: 7px 10px;
    border:none;
    border-radius: 6px;
    background: var(--green);
    color:white;
    font-size: 12px;
    cursor:pointer;
    white-space:nowrap;
  }
  .del-btn{
    background: transparent !important;
    color: #a04040 !important;
    border: 1px solid #a04040 !important;
    margin-top: 6px;
    font-size: 11.5px !important;
    padding: 4px 8px !important;
  }
  .empty{
    text-align:center;
    color: var(--gold-dark);
    font-size: 13.5px;
    font-style: italic;
    padding: 20px 0;
  }
  .note{
    text-align:center;
    font-size: 12px;
    color: var(--gold-dark);
    margin-top: 20px;
    line-height:1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Guest Link Generator</h1>
  <div class="sub">Private — for your use only. Not linked from the invite page.</div>

  <div class="form-card">
    <label>Guest / family name</label>
    <input type="text" id="nameInput" placeholder="e.g. Mustafa Bhai's Family" />

    <label>How many are invited from this family?</label>
    <input type="number" id="countInput" min="1" value="1" />

    <button class="add-btn" onclick="addGuest()">+ Generate link</button>
  </div>

  <div class="list-header">
    <h2>Your guest links</h2>
    <button class="copy-all-btn" onclick="copyAll()">Copy all</button>
  </div>

  <div id="guestList"></div>
</div>

<script>
  // Base URL = wherever this admin page lives, minus "admin.html"
  const baseUrl = window.location.href.replace(/admin\.html.*$/, "");

  let guests = JSON.parse(localStorage.getItem("rsvpGuests") || "[]");

  function save(){
    localStorage.setItem("rsvpGuests", JSON.stringify(guests));
    render();
  }

  function addGuest(){
    const nameEl = document.getElementById("nameInput");
    const countEl = document.getElementById("countInput");
    const name = nameEl.value.trim();
    const count = parseInt(countEl.value || "1", 10);
    if (!name) { nameEl.focus(); return; }

    const slug = name.replace(/\s+/g, "_");
    const link = `${baseUrl}?g=${encodeURIComponent(slug)}&n=${count}`;

    guests.unshift({ name, count, link });
    save();

    nameEl.value = "";
    countEl.value = "1";
    nameEl.focus();
  }

  function removeGuest(index){
    guests.splice(index, 1);
    save();
  }

  function copyLink(index, btn){
    navigator.clipboard.writeText(guests[index].link).then(() => {
      const original = btn.textContent;
      btn.textContent = "Copied!";
      setTimeout(() => { btn.textContent = original; }, 1200);
    });
  }

  function copyAll(){
    if (guests.length === 0) return;
    const text = guests
      .map(g => `${g.name} (${g.count}): ${g.link}`)
      .join("\n");
    navigator.clipboard.writeText(text).then(() => {
      alert("All guest links copied to clipboard.");
    });
  }

  function render(){
    const listEl = document.getElementById("guestList");
    if (guests.length === 0) {
      listEl.innerHTML = `<div class="empty">No guests added yet. Add your first family above.</div>`;
      return;
    }
    listEl.innerHTML = guests.map((g, i) => `
      <div class="guest-item">
        <div class="name">${g.name}</div>
        <div class="meta">Invited: ${g.count} ${g.count > 1 ? "people" : "person"}</div>
        <div class="link-row">
          <input type="text" readonly value="${g.link}" onclick="this.select()" />
          <button onclick="copyLink(${i}, this)">Copy</button>
        </div>
        <button class="del-btn" onclick="removeGuest(${i})">Remove</button>
      </div>
    `).join("");
  }

  render();
</script>
</body>
</html>
